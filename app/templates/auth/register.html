{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="auth-wrap" style="display: flex; justify-content: center; align-items: center; min-height: 60vh;">
    <div class="panel" style="max-width: 440px; width: 100%;">
        <div style="text-align: center; margin-bottom: 24px;">
            <h2 style="margin-bottom: 8px;">Создать аккаунт</h2>
            <p class="muted small">Все подписки в одном месте</p>
        </div>

        {% if error %}
        <div class="alert error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/auth/register-form">
            <div class="field">
                <label>Email</label>
                <input name="email" type="email" required placeholder="name@example.com">
            </div>
            <div class="field">
                <label>Телефон</label>
                <!-- data-phone-mask включает маску -->
                <input name="phone" type="tel" required placeholder="+7 (999) 123-45-67" data-phone-mask>
            </div>
            <div class="field">
                <label>Пароль</label>
                <input name="password" type="password" required minlength="8" placeholder="Минимум 8 символов">
            </div>
            <div class="field">
                <label>Повторите пароль</label>
                <input name="password_confirm" type="password" required minlength="8" placeholder="Минимум 8 символов">
            </div>
            <label style="display: flex; gap: 10px; align-items: flex-start; font-size: 13px; margin: 16px 0; cursor: pointer;">
                <input type="checkbox" name="accept_terms" value="1" required style="width: 16px; height: 16px; margin-top: 2px;">
                <span>Я принимаю <a href="/legal/terms" target="_blank">пользовательское соглашение</a> и <a href="/legal/privacy" target="_blank">политику конфиденциальности</a></span>
            </label>
            <button type="submit" class="btn block">Зарегистрироваться</button>
        </form>
        <p style="text-align: center; margin-top: 20px; font-size: 14px;" class="muted">
            Уже есть аккаунт? <a href="/auth/login">Войти</a>
        </p>
    </div>
</div>
{% endblock %}
