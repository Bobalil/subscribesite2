{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="auth-promo">
        <h1>Создайте кошелёк</h1>
        <p>Все подписки в одном месте. Один платёж — и всё оплачено.</p>
    </div>
    <div class="panel auth-card">
        <h2 style="margin-top:0">Регистрация</h2>
        
        {% if error %}
        <div class="alert error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/auth/register-form" class="stack">
            <div class="field">
                <label>Email</label>
                <input name="email" type="email" required>
            </div>
            <div class="field">
                <label>Телефон</label>
                <input name="phone" type="tel" required placeholder="+7 (999) 123-45-67" data-phone-mask>
            </div>
            <div class="field">
                <label>Пароль</label>
                <input name="password" type="password" required minlength="8">
            </div>
            <div class="field">
                <label>Повторите пароль</label>
                <input name="password_confirm" type="password" required minlength="8">
            </div>
            <label style="display:flex;gap:8px;align-items:flex-start;font-size:13px;margin-top:8px">
                <input type="checkbox" name="accept_terms" value="1" required style="width:auto">
                <span>Принимаю <a href="/legal/terms" target="_blank">соглашение</a> и <a href="/legal/privacy" target="_blank">политику ПДн</a></span>
            </label>
            <button type="submit" class="block" style="margin-top:12px">Зарегистрироваться</button>
        </form>
        <p class="center small muted" style="margin-top:16px">Уже есть аккаунт? <a href="/auth/login">Войти</a></p>
    </div>
</div>
<script src="/static/js/phone-mask.js"></script>
{% endblock %}
