{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="auth-promo">
        <h1>С возвращением</h1>
        <p>Войдите, чтобы управлять своими подписками.</p>
    </div>
    <div class="panel auth-card">
        <h2 style="margin-top:0">Вход</h2>

        {% if error %}
        <div class="alert error" style="color: #b42318; background: #fdecea; padding: 10px; border-radius: 8px; margin-bottom: 16px;">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/auth/login-form" class="stack">
            <div class="field">
                <label>Email</label>
                <input name="email" type="email" required>
            </div>
            <div class="field">
                <label>Пароль</label>
                <input name="password" type="password" required>
            </div>
            <button type="submit" class="block" style="margin-top:12px">Войти</button>
        </form>
        <p class="center small muted" style="margin-top:16px">Нет аккаунта? <a href="/auth/register">Создать</a></p>
    </div>
</div>
{% endblock %}
