<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Подписки.Одно{% endblock %}</title>
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('theme');
                var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="site-header">
    <div class="header-inner">
        <a href="/" class="brand">
            <span class="mark">П</span>
            <span>
                Подписки.Одно
                <small>Единый кошелёк</small>
            </span>
        </a>

        <nav class="nav">
            {% if user %}
                <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Главная</a>
                <a href="/subscriptions" class="{% if request.url.path == '/subscriptions' %}active{% endif %}">Подписки</a>
                <a href="/cards" class="{% if request.url.path == '/cards' %}active{% endif %}">Карта</a>
                <button class="theme-toggle" type="button" data-theme-toggle title="Сменить тему">
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                </button>
                <a href="/auth/logout">Выйти</a>
            {% else %}
                <a href="/auth/login">Войти</a>
                <a href="/auth/register" class="cta">Регистрация</a>
            {% endif %}
        </nav>
    </div>
</header>

<main>
    {% block content %}{% endblock %}
</main>

<footer class="site-footer">
    © 2026 Подписки.Одно
</footer>

<script>
    document.querySelectorAll('[data-theme-toggle]').forEach(btn => {
        btn.addEventListener('click', function() {
            const cur = document.documentElement.getAttribute('data-theme');
            const next = cur === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        });
    });
</script>
<script src="/static/js/cookie-banner.js"></script>
</body>
</html>
