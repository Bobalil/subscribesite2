<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Подписки.Одно{% endblock %}</title>
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('theme');
                var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {}
        })();
    </script>
    <!-- Шрифт Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="site-header">
    <div class="header-inner">
        <a href="/" class="brand">
            <span class="mark">П</span>
            <span>Подписки.Одно<small>Единый кошелёк</small></span>
        </a>

        <nav class="nav">
            {% if user %}
                <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Главная</a>
                <a href="/subscriptions" class="{% if request.url.path == '/subscriptions' %}active{% endif %}">Подписки</a>
                <a href="/cards" class="{% if request.url.path == '/cards' %}active{% endif %}">Карта</a>
                
                <div class="nav-divider"></div>

                <!-- Переключатель валют -->
                <select data-currency-switcher class="currency-select" title="Валюта">
                    <option value="RUB">₽ RUB</option>
                    <option value="USD">$ USD</option>
                </select>

                <!-- Переключатель темы -->
                <button class="icon-btn" type="button" data-theme-toggle title="Сменить тему">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
                </button>
                
                <a href="/auth/logout" class="btn ghost small-btn">Выйти</a>
            {% else %}
                <select data-currency-switcher class="currency-select" title="Валюта">
                    <option value="RUB">₽ RUB</option>
                    <option value="USD">$ USD</option>
                </select>
                <button class="icon-btn" type="button" data-theme-toggle title="Сменить тему">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
                </button>
                <a href="/auth/login" class="btn ghost">Войти</a>
                <a href="/auth/register" class="btn">Регистрация</a>
            {% endif %}
        </nav>
    </div>
</header>

<main>
    {% block content %}{% endblock %}
</main>

<footer class="site-footer">
    © 2026 Подписки.Одно · Все подписки в одном кошельке
</footer>

<script>
    // Логика смены темы
    document.querySelectorAll('[data-theme-toggle]').forEach(btn => {
        btn.addEventListener('click', function() {
            const cur = document.documentElement.getAttribute('data-theme');
            const next = cur === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        });
    });
</script>
<script src="/static/js/cookie-banner.js"></script>
<script src="/static/js/currency-switcher.js"></script>
<script src="/static/js/phone-mask.js"></script>
</body>
</html>
